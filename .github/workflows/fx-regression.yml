name: FX source regressions
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: SceneFX
      - uses: actions/checkout@v4
        with:
          repository: juanamores98/LumenFX
          ref: a786c75c87785e0e79e7880794dc9de2123d66cf
          path: LumenFX
      - uses: actions/checkout@v4
        with:
          repository: juanamores98/AtmosphereFX
          ref: c04c554f7b01f2ce34d4dd3dc0a941b43a17a1d6
          path: AtmosphereFX
      - uses: actions/checkout@v4
        with:
          repository: juanamores98/ClassicLightFX
          ref: 6a4b6cc8efafa700c3ca0683b899fcdb47f15196
          path: ClassicLightFX
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run source regressions with isolated game doubles
        run: dotnet run --project SceneFX/tests/Regression/Regression.csproj -c Release
