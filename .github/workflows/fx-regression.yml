name: FX source regressions
on:
  push:
    paths:
      - "Source/**"
      - "BuiltIns/**"
      - "tests/**/*.cs"
      - "tests/**/*.csproj"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: SceneFX
      - uses: actions/checkout@v4
        with:
          repository: juanamores98/LumenFX
          ref: 367d9a55ef172e20c894b3db6cd5c982e57d00c9
          path: LumenFX
      - uses: actions/checkout@v4
        with:
          repository: juanamores98/AtmosphereFX
          ref: a5daebe8541067488ce334944ab61fce8b2286e8
          path: AtmosphereFX
      - uses: actions/checkout@v4
        with:
          repository: juanamores98/ClassicLightFX
          ref: 9dfe6fcef8b5941082a2b245bca69bd4c19f5ba5
          path: ClassicLightFX
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run source regressions with isolated game doubles
        run: dotnet run --project SceneFX/tests/Regression/Regression.csproj -c Release
